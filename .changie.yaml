# Changie configuration — https://changie.dev/config/
# Source of truth for release notes; see RELEASE.md for the release workflow.

changesDir: changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md

# --- Templates -------------------------------------------------------------
versionFormat: '## [{{ .Version }}](https://github.com/skyoo2003/acor/releases/tag/{{ .Version }}) - {{ .Time.Format "2006-01-02" }}'
kindFormat: '### {{ .Kind }}'
changeFormat: '* {{ .Body }} ([#{{ .Custom.Issue }}](https://github.com/skyoo2003/acor/issues/{{ .Custom.Issue }}))'

# --- Spacing (Keep a Changelog / markdownlint-friendly) --------------------
# Applied on `changie merge`, so the whole CHANGELOG re-flows cleanly.
newlines:
  beforeChangelogVersion: 1   # blank line after the header and between versions
  beforeKind: 1               # blank line before each "### Kind" header
  afterKind: 1                # blank line after each "### Kind" header

# --- Change body prompt ----------------------------------------------------
# One sentence. Two at the very most, and only when the second carries the
# consequence for the reader: a migration step, a measured number, or what
# deliberately did not change. Everything else — the investigation, the file
# list, the rationale — belongs in the pull request, not the release note.
# `block` is off and `maxLength` is set so an entry that wants paragraphs fails
# at `changie new` rather than at review.
body:
  block: false                # single line — no paragraphs
  minLength: 5
  maxLength: 400              # ~2 sentences; a ceiling, not a target

# --- Kinds -----------------------------------------------------------------
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
  - label: Documentation

# --- Prompted custom fields ------------------------------------------------
custom:
  - key: Issue
    label: Issue Number
    type: int
    minInt: 1
