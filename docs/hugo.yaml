baseURL: https://skyoo2003.github.io/acor/
languageCode: en-us
title: ACOR Docs
disableKinds:
  - taxonomy
  - term
module:
  mounts:
    - source: ../benchmarks/results/v3-delta-20260914-redis.json
      target: data/v3delta/redis.json
    - source: ../benchmarks/results/v3-delta-20260914-valkey.json
      target: data/v3delta/valkey.json
    - source: ../benchmarks/results/v3-20260906.json
      target: data/benchmarks/v3.json
    - source: ../benchmarks/results/r2-r3-20260906.json
      target: data/benchmarks/r2r3.json
caches:
  images:
    dir: :cacheDir/images
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        enable: true
  highlight:
    codeFences: true
    guessSyntax: true
    style: github
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
menu:
  main:
    - name: Getting Started
      url: /getting-started/
      weight: 1
    - name: Guides
      url: /guides/
      weight: 2
    - name: Reference
      url: /reference/
      weight: 3
    - name: Operations
      url: /operations/
      weight: 4
    - name: Server
      url: /server/
      weight: 5
    - name: CLI
      url: /cli/
      weight: 6
    - name: Extending
      url: /extending/
      weight: 7
