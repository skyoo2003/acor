name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
  schedule:
    - cron: "15 3 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # codeql-action v4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # codeql-action v4
        with:
          category: "/language:go"
