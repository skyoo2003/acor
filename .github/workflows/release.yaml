name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # setup-go v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # setup-buildx-action v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # login-action v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify changie release notes exist
      run: |
        if [ ! -f "changes/${{ github.ref_name }}.md" ]; then
          echo "::error::Changie fragment changes/${{ github.ref_name }}.md not found."
          echo "::error::Run 'changie batch ${{ github.ref_name }}' and 'changie merge' before pushing the tag."
          exit 1
        fi
    # The obligation attaches at redistribution, so it is gated here and not only
    # in CI: the CI job is path-filtered, and a tag can be pushed at a commit
    # whose merge never matched those paths. Runs before GoReleaser so a stale
    # NOTICE fails the release rather than shipping inside the archives, the
    # images, and the brew bottle.
    - name: Check third-party notices
      run: make license-check
    # Short-lived token scoped to the homebrew-tap repository only, for the
    # brews section in .goreleaser.yaml, which owns the tap coordinates. The
    # owner defaults to this repository's owner. Expires with the job, so
    # nothing long-lived is stored anywhere.
    - name: Mint a Homebrew tap token
      id: tap_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # create-github-app-token v3.2.0
      with:
        app-id: ${{ secrets.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        repositories: homebrew-tap
    - name: Execute GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # goreleaser-action v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean --release-notes changes/${{ github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token }}
