name: Go

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "Makefile"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      # Every module's manifests, not just the root's: a Dependabot bump scoped
      # to server/ or benchmarks/ touches no root file and no .go file, so
      # without these it would merge without CI ever running.
      - "server/go.mod"
      - "server/go.sum"
      - "benchmarks/go.mod"
      - "benchmarks/go.sum"
      - ".github/workflows/*.yaml"
      - ".golangci.yaml"
      # The attribution file itself: a PR that edits only NOTICE is a PR that
      # records a third-party attribution change, which is precisely the case the
      # gate must not skip.
      - "NOTICE"
      # The snapshot itself: a PR that edits only this file is a PR that records
      # an API change, which is precisely the case the gate must not skip.
      - "api/v1.txt"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "Makefile"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      # Every module's manifests, not just the root's: a Dependabot bump scoped
      # to server/ or benchmarks/ touches no root file and no .go file, so
      # without these it would merge without CI ever running.
      - "server/go.mod"
      - "server/go.sum"
      - "benchmarks/go.mod"
      - "benchmarks/go.sum"
      - ".github/workflows/*.yaml"
      - ".golangci.yaml"
      # The attribution file itself: a PR that edits only NOTICE is a PR that
      # records a third-party attribution change, which is precisely the case the
      # gate must not skip.
      - "NOTICE"
      # The snapshot itself: a PR that edits only this file is a PR that records
      # an API change, which is precisely the case the gate must not skip.
      - "api/v1.txt"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # setup-go v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum
            server/go.sum
            benchmarks/go.sum
      - name: Execute golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # golangci-lint-action v9.3.0
        with:
          version: v2.11.3
      - name: Execute golangci-lint (server module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # golangci-lint-action v9.3.0
        with:
          version: v2.11.3
          working-directory: server
      - name: Run go vet
        run: go vet ./...
      - name: Run go vet (server module)
        run: go vet ./...
        working-directory: server
      # The benchmarks module has no test step of its own here, so vet is what
      # keeps it compiling as the core API it measures through changes.
      - name: Run go vet (benchmarks module)
        run: go vet ./...
        working-directory: benchmarks
      - name: Check SPDX headers
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          missing=$(git ls-files '*.go' | xargs grep -L -E '^// SPDX-License-Identifier:' || true)
          if [ -n "$missing" ]; then
            echo "Missing SPDX headers in:"
            echo "$missing"
            exit 1
          fi
      - name: Run test
        run: go test -race -v -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Run test (server module)
        run: go test -race -v -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: server
      - name: Check coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          fail=0
          for mod in . server; do
            # Run in each module's dir: server/ is a separate go.mod, so the
            # cover tool needs that module's context to resolve packages.
            # Exclude generated protobuf (*.pb.go) from the coverage denominator.
            coverage=$(cd "$mod" && grep -v '\.pb\.go:' coverage.out > coverage.nogen.out && go tool cover -func=coverage.nogen.out | tail -1 | awk '{print $3}' | sed 's/%//')
            echo "${mod}: ${coverage}%"
            awk -v c="$coverage" 'BEGIN { exit (c < 70) ? 1 : 0 }' \
              || { echo "::error::${mod} coverage ${coverage}% is below threshold 70%"; fail=1; }
          done
          # A percentage cannot see a function nothing calls: pkg/acor was 89% green
          # while four functions sat at exactly 0.0%. Reading them turned up one of
          # each failure shape — rollbackRemoved was live error-recovery code no test
          # drove, and the deferred-batch trio was unreachable from any configuration.
          # Both are worse to discover after v1 freezes, so this is a gate rather than
          # a measurement someone remembers to take.
          #
          # Scoped to pkg/acor by path prefix, and the prefix is load-bearing: the
          # profile is built with -coverpkg=./..., so examples/, cmd/ and tools/ are
          # in it and legitimately carry 0.0% functions.
          uncovered=$(go tool cover -func=coverage.nogen.out \
            | awk '$1 ~ /^github\.com\/skyoo2003\/acor\/pkg\/acor\// && $3 == "0.0%"')
          if [ -n "$uncovered" ]; then
            echo "$uncovered"
            echo "::error::pkg/acor has functions at 0.0% coverage. Cover them, or delete them if nothing can reach them."
            fail=1
          fi
          exit $fail
      - name: Run fuzz testing
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          go test -fuzz=FuzzFind -fuzztime=30s ./pkg/acor
          go test -fuzz=FuzzAdd -fuzztime=30s ./pkg/acor
      - name: Run build
        run: make build
      - name: Verify documentation examples compile
        run: make docs-verify
      # Pinned to one matrix leg: the check is a git diff of generated text, so it
      # is platform-independent and running it four times would add no signal. A
      # failure means the set of modules linked into the acor binary changed without
      # NOTICE being regenerated, which would ship the release archives and images
      # with a dependency's copyright notice stripped — something the MIT and BSD
      # licenses those dependencies carry do not permit.
      - name: Check third-party notices
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: make license-check
      # Pinned to one leg for the same reason, and apisnap's output was verified
      # byte-identical under go1.25.8 and go1.26.1.
      - name: Check public API surface
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: make api-check
      # The go command reads retractions only from the highest published version's
      # go.mod, so a release whose go.mod lost this block silently un-retracts
      # v1.0.0-v1.4.0 and `go get` starts resolving them again. RELEASE.md states
      # the rule; this is what enforces it.
      #
      # Asked of `go mod edit -json` rather than of grep: what matters is whether the
      # go command sees a retraction, and a commented-out directive still matches the
      # text while retracting nothing. Parsing also accepts the block form of the
      # directive, which a text search would have to be taught separately.
      - name: Verify retraction block
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          if ! go mod edit -json | jq -e '[.Retract[]? | select(.Low == "v1.0.0" and .High == "v1.4.0")] | length == 1' >/dev/null; then
            echo "::error::go.mod has no active 'retract [v1.0.0, v1.4.0]'. Releasing without it silently un-retracts v1.0.0-v1.4.0. See RELEASE.md#retracted-versions."
            exit 1
          fi

  integration:
    name: Integration (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: redis
            image: redis:8
            ping: redis-cli ping
          - server: valkey
            image: valkey/valkey:8
            ping: valkey-cli ping
    services:
      backend:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.ping }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # setup-go v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: Run integration tests against ${{ matrix.server }}
        env:
          ACOR_INTEGRATION_ADDR: localhost:6379
        run: go test -race -run Integration -count=1 -v ./pkg/acor
      - name: Verify published round-trip counts against ${{ matrix.server }}
        env:
          ACOR_INTEGRATION_ADDR: localhost:6379
        run: go test -run RTT -count=1 -v ./pkg/acor
      # One iteration only: proves the benchmarks behind the published numbers
      # still run. Container timings are too noisy to gate on, so this must
      # never assert a duration. Scoped to RealServer because the miniredis
      # benchmarks take minutes to sweep and their compilation is already
      # covered by `go test ./...`.
      - name: Smoke-run published benchmarks against ${{ matrix.server }}
        env:
          ACOR_INTEGRATION_ADDR: localhost:6379
        run: go test -bench RealServer -benchtime=1x -run '^$' ./pkg/acor
      # Same rule as above: one iteration, never gated on a duration. This keeps the
      # benchmarks module behind docs/content/reference/benchmarks.md compiling and
      # running. The propagation test does assert behavior (invalidation arrives, and
      # the staleness window returns stale answers rather than errors), so it runs for
      # real rather than as a smoke.
      - name: Smoke-run the benchmarks module against ${{ matrix.server }}
        working-directory: benchmarks
        env:
          ACOR_INTEGRATION_ADDR: localhost:6379
        run: |
          go test -bench . -benchtime=1x -run '^$' ./...
          go test -run 'MemoryFootprint|Propagation' ./...
