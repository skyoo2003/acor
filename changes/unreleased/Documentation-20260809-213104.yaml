kind: Documentation
body: Corrected `CONTRIBUTING.md` where it described a process this repository does not run. It told contributors to create their branch from `master` and open the pull request against `master` — a branch that does not exist here, and the same fix [#141](https://github.com/skyoo2003/acor/issues/141) already applied elsewhere without reaching this file. It listed `make all` as six targets when it runs seven, omitting `api-check`, the gate that fails a pull request carrying an unrecorded change to the public API; `docs-verify` and `tidy-check` were undocumented for the same reason. It also carried its own pull-request checklist that had drifted out of step with the template GitHub actually renders, while line 46 instructed contributors to fill in that template; the duplicate is now a pointer to it. Added the changelog-fragment step, which `RELEASE.md` requires of every contributor but `CONTRIBUTING.md` never mentioned. The Redis prerequisite claimed a `>= 6.0` floor that no other document states; it now carries the one `README.md` and the installation guide actually publish — Redis 3.0 or Valkey 7.2 — while noting that CI exercises only version 8 of each. Valkey had been omitted from the document entirely.
