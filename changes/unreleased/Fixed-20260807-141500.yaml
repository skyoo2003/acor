kind: Fixed
body: 'Corrected thirteen godoc claims on the frozen v1 surface that did not match the code. `ParallelOptions.ChunkSize` documented a fallback to `DefaultChunkSize`, but a caller-built struct that leaves it unset gets `ErrInvalidChunkSize`. `ParallelOptions.Overlap` documented `DefaultOverlap` the same way but stays at zero, silently missing keywords that straddle a chunk boundary; only `DefaultParallelOptions()` supplies either default. `BatchOptions.Mode` and `BatchModeBestEffort` described the mode as defaulting "if nil", but `BatchMode` is an int: unset means the zero value, and a nil `*BatchOptions` is a separate case. `BatchResult.Skipped` also covers keywords a batch found already present, not just duplicates within the input. `AhoCorasick.Debug()` writes through the configured `Logger` rather than stdout, so a default instance produces no output. `AhoCorasick.Info()` does not return the schema version; `SchemaVersion()` does. `Add`/`Remove` treat an empty keyword as a no-op returning `(0, nil)`. `ErrEmptyKeyword` is returned only by the batch forms. `ErrConcurrencyConflict` surfaces only after the internal retry with backoff is exhausted, so an immediate caller-side retry is wrong. `CacheStats.Misses` counts a failed Redis fetch as a miss for Preset and cached V2, but not for default V2 or V1. The `KVStorage` godoc offered mock implementations for testing, but nothing on the public surface accepts one. No signature, sentinel identity, or behavior changed; `api/v1.txt` is unchanged.'
