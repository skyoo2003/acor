kind: Fixed
body: 'Corrected thirteen godoc claims on the frozen v1 surface that did not describe what the code does. `ParallelOptions.ChunkSize` promised a fallback to `DefaultChunkSize`; a caller-built struct that left it unset got `ErrInvalidChunkSize` instead, so the documented default was an error return. `ParallelOptions.Overlap` promised `DefaultOverlap` the same way and in fact stayed at zero, silently missing keywords that straddle a chunk boundary. Only `DefaultParallelOptions()` supplies either. `BatchOptions.Mode` and `BatchModeBestEffort` described the mode as defaulting "if nil", but `BatchMode` is an int and cannot be nil; unset means the zero value, and a nil `*BatchOptions` is the separate case. `BatchResult.Skipped` listed only duplicates within the input, omitting the keywords a batch found already present. `AhoCorasick.Debug()` said it prints to stdout — it writes through the configured `Logger`, so on a default instance it produces no output at all. `AhoCorasick.Info()` said it returns the schema version; `AhoCorasickInfo` has no such field, and `SchemaVersion()` is the call that answers it. `Add`/`Remove` did not say that an empty keyword is a no-op reporting `(0, nil)`. `ErrEmptyKeyword` said it is returned for any empty keyword; only the batch forms return it. `ErrConcurrencyConflict` said it surfaces when a conflict occurs and told the caller to retry; writes already retry internally with backoff, so it escapes only once that ramp is spent. `CacheStats.Misses` said a failed Redis fetch is always a miss; that holds for Preset and cached V2 but not for default V2 or V1. `KVStorage` offered that mock implementations can be used for testing; nothing on the public surface accepts one. No signature, sentinel identity, or behavior changed — `api/v1.txt` is unmoved.'
