kind: Added
body: The `NOTICE` file now records the copyright notice and full license text of every third-party module linked into the `acor` binary, and ships inside the release archives and container images. `make license-check` regenerates it from the module graph and CI gates the result, so a dependency change cannot silently drop an attribution.
