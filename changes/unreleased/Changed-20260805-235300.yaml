kind: Changed
body: 'V1 collections are now read-only. `Add` and `Remove` return the new `ErrV1ReadOnly` sentinel; `Find`, `FindIndex`, `Suggest`, `Info`, `Flush`, and `MigrateV1ToV2` all keep working, so an existing V1 collection can still be read and converted in place. Selecting `SchemaVersion: SchemaV1` for a fresh collection produces one that can never gain a keyword. Batch calls report the refusal per keyword in `BatchResult.Failed`, as they do for any per-keyword failure. Maintaining two write paths meant every change had to be correct in both; the V1 read path stays for the whole v1 line and is removed no earlier than v2'
