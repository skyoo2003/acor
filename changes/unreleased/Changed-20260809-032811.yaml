kind: Changed
body: 'FindSet dedups by keyword id instead of by string: each engine state now carries a 4-byte pattern id with the keyword strings interned once, and the unique-set collector is a single bitset test per reported keyword. At 1000 keywords over match-dense text this makes FindSet 1.4-3.5x faster and cuts per-query allocations from 178 KB/44 to 35 KB/9, with sparse text unchanged. No public API change.'
