kind: Documentation
body: 'Documented the experimental `acor/server` module, which had no section on the docs site: its eight `/v1/*` HTTP endpoints and its entire gRPC service (`acor.server.v1.Acor`) appeared nowhere, and neither did the wiring needed to serve them. A new top-level Server section covers running a server, the HTTP API, and the gRPC API. ACOR ships no server binary — `server/` is a library with no `main.go` — so "Running a Server" is a complete, copy-pasteable `main` for each protocol, both compile-gated by `doccheck`. The error contracts are documented as they behave rather than as they ought to: every collection failure flattens to HTTP 500 or gRPC `codes.Internal`, and an unmatched path is the one non-JSON response. Also enabled `doccheck` on the deployment guide''s health-check example, which had never been compiled.'
