kind: Added
body: '`AhoCorasick.CacheStats()` reports the local cache hit rate, rebuild cost, and the lag of the last peer invalidation, with no Redis I/O. Metrics were previously exposed only by the experimental `server/` module, so a library user could observe the cache only by inferring it from latency. Counters are per instance and per process. `CacheStats` is only returned, never constructed by callers, so it may gain fields within v1.'
