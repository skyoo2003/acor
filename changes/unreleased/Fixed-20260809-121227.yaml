kind: Fixed
body: 'Restored the verbatim Apache-2.0 text in `LICENSE`, so pkg.go.dev detects the license instead of reporting `License: UNKNOWN` and hiding the package documentation behind "Documentation not displayed due to license restrictions". The committed text had drifted from the canonical wording in three places — `submitted to the Licensor`, `received by the Licensor`, and `excluding any notices` — and the `APPENDIX` section had been dropped. pkg.go.dev matches the file against a fixed pattern with `github.com/google/licensecheck`, so a single substituted word breaks the match and the coverage falls under the 75% threshold the site requires. `server/` is a separate module whose zip does not carry the parent directory''s files, so it gets its own copy as a regular file: the module zip builder skips symlinks, and a link would have left that module unlicensed. Per-version license data is immutable, so v1.5.0 stays `UNKNOWN`; this takes effect from the next tag.'
