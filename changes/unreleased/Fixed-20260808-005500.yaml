kind: Fixed
body: 'Finished the godoc audit of the frozen v1 surface — all 180 entries are now read against the code, and this pass corrected the remaining claims. Topology: `Addr` said it is "ignored if Addrs is set", but setting both is `ErrRedisConflictingTopology`; and cluster was documented as needing "multiple entries" in `Addrs` when a single-element list already selects it, so a one-address setup plus a `DB` fails with `ErrRedisClusterDB` where the same address in `Addr` would not. Schema: V2 was described as "3 Redis keys" everywhere; only `MigrateV1ToV2` ever writes `{name}:nodes`, so a natively built collection has two and a fresh one has one. Migration: `MigrationResult.RolledBack` is never set by anything and is always false; `KeysBefore` is an estimate (`Prefixes + Keywords + 2`) that read 17 for a collection holding 13; `KeysAfter` is a constant, not a count; `DurationMs` stays 0 on the error paths; `Progress` reports 4/5 on a dry run and never reaches `done == total`; and `DryRun` still takes the migration lock. `RollbackToV1` documented only the keywords lost, not that the collection becomes read-only afterwards, which makes it a one-way door. `FlushContext` promised cancellation propagation that V1 does not honor — it runs on a fresh `RollbackTimeout`-bounded context — and `RollbackTimeout` itself documented only a path `Add` can no longer reach. `Suggest`/`SuggestIndex` did not mention that Preset mode returns `ErrSuggestRequiresRedis`, `FindMany` discards earlier results on the first error, `AddMany`/`RemoveMany` screen duplicates on the normalized keyword (so "Foo" and "foo" are one), and `Debug` is silently a no-op when a `Logger` is set. No signature, sentinel identity, or behavior changed — `api/v1.txt` is unmoved.'
