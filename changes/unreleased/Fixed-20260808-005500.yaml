kind: Fixed
body: 'Completed the godoc audit of the frozen v1 surface: all 180 entries are now checked against the code, and this pass corrected the remaining claims. Topology: `Addr` is not "ignored if Addrs is set" — setting both returns `ErrRedisConflictingTopology`; and a single-element `Addrs` already selects cluster mode, not "multiple entries", so a one-address setup with a `DB` fails with `ErrRedisClusterDB` where the same address in `Addr` would not. Schema: V2 was documented as three Redis keys, but only `MigrateV1ToV2` writes `{name}:nodes`, so a natively built collection has two and a fresh one has one. Migration: `MigrationResult.RolledBack` is never set and is always false; `KeysBefore` is an estimate (`Prefixes + Keywords + 2`) that reported 17 for a collection holding 13; `KeysAfter` is a constant, not a count; `DurationMs` stays 0 on the error paths; `Progress` reports 4/5 on a dry run and never reaches `done == total`; and `DryRun` still takes the migration lock. `RollbackToV1` documented the keywords lost but not that the collection becomes read-only afterwards, making it one-way. `FlushContext` does not propagate cancellation on V1 — it runs on a fresh context bounded by `RollbackTimeout` — and `RollbackTimeout` documented only a path `Add` can no longer reach. Newly documented: `Suggest`/`SuggestIndex` return `ErrSuggestRequiresRedis` in Preset mode, `FindMany` discards earlier results on the first error, `AddMany`/`RemoveMany` screen duplicates on the normalized keyword (so "Foo" and "foo" are one), and `AhoCorasickArgs.Debug` is ignored when a `Logger` is also set. No signature, sentinel identity, or behavior changed; `api/v1.txt` is unchanged.'
