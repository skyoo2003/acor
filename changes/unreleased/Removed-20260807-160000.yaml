kind: Removed
body: 'Unexported the storage abstraction — `KVStorage`, `Pipeliner`, `Subscription`, `StringMapResult`, `PubSubMessage`, and `Z` — removing 43 of the 223 entries on the frozen v1 surface. No exported function accepted or returned one, so the interfaces could be named but never supplied. Freezing them would also have capped the pluggable-backend work they were exported for: the compatibility policy forbids adding a method to an exported interface within v1, and `KVStorage` has 23. Unexported, their shape stays open until that feature settles it, and publishing an interface later is an addition v1 allows. No behavior changed and the Redis backend is unaffected; for testing without Redis, use miniredis as the ACOR test suite does.'
