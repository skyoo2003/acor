kind: Documentation
body: "Condensed the documentation site and removed duplicated pages. `preset-engine` and `redis-backed-engine` each carried a Quick Start, an API Reference block, and a preset table; they now split by question — which preset to pick, versus how the engine stays in sync across instances. `reference/api` repeated the Create/Add/Find/Info/Flush/Close surface in a second preset section and gave a one-line heading to each method; methods are tables now, with prose reserved for the contracts that need it. Eight pages carried hand-written nav footers the theme already renders, `monitoring` listed the same Grafana panels twice, and `deployment` repeated the topology and health-check wiring from other pages. Three defects surfaced: `extending/custom-storage` linked to `guides/presets/`, which does not exist; `cli/_index` and `getting-started/installation` disagreed on the command count; and `reference/api` omitted `FindSetContext` from its context-variants list. Performance and verification reports keep every data table unchanged. No documented behavior changed."
