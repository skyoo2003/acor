kind: Fixed
body: Fixed a lost update in Preset mode. A single `Add` or `Remove` rebuilt the local automaton from an incrementally maintained keyword set instead of the snapshot it had just committed, then cleared the stale flag and advanced the local version, so a keyword written by a peer disappeared from local `Find` results and was never refetched because the instance looked up to date. Single writes now apply the committed snapshot, as batch writes already did.
