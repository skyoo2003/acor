kind: Changed
body: 'Moved every public type that was a type alias into an internal package to `pkg/acor` itself: `KVStorage`, `Z`, `Pipeliner`, `Subscription`, `StringMapResult`, `PubSubMessage`, `Preset`, and `Match` are now declared where they are exported, and the `internal/storage` package is gone. This is source-compatible — the interfaces keep byte-identical method sets and Go satisfies them structurally, and the structs keep the same fields — so custom `KVStorage` backends and `Match` consumers need no changes. Internal refactors can no longer break the public API by accident'
