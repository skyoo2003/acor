syntax = "proto3";

package acor.server.v1;

option go_package = "github.com/skyoo2003/acor/server/proto/acor/v1;acorv1";

// Acor is the gRPC surface for an Aho-Corasick keyword collection. It mirrors
// the HTTP/JSON adapter one-to-one.
service Acor {
  rpc Add(KeywordRequest) returns (CountResponse);
  rpc Remove(KeywordRequest) returns (CountResponse);
  rpc Find(InputRequest) returns (MatchesResponse);
  rpc FindIndex(InputRequest) returns (MatchIndexesResponse);
  rpc Suggest(InputRequest) returns (MatchesResponse);
  rpc SuggestIndex(InputRequest) returns (MatchIndexesResponse);
  rpc Info(EmptyRequest) returns (InfoResponse);
  rpc Flush(EmptyRequest) returns (StatusResponse);
  rpc Status(EmptyRequest) returns (VersionedStatusResponse);
  rpc VersionedFind(VersionedInputRequest) returns (MatchesResponse);
  rpc VersionedScan(VersionedScanRequest) returns (VersionedScanResponse);
  rpc VersionedMask(VersionedRewriteRequest) returns (VersionedRewriteResponse);
  rpc VersionedReplaceText(VersionedRewriteRequest) returns (VersionedRewriteResponse);
  rpc VersionedReplace(VersionedWriteRequest) returns (VersionedWriteResponse);
  rpc VersionedAdd(VersionedWriteRequest) returns (VersionedWriteResponse);
  rpc VersionedRemove(VersionedWriteRequest) returns (VersionedWriteResponse);
  rpc VersionedAddMany(VersionedWriteRequest) returns (VersionedWriteResponse);
  rpc VersionedRemoveMany(VersionedWriteRequest) returns (VersionedWriteResponse);
  rpc VersionedWait(VersionedWaitRequest) returns (StatusResponse);
  rpc ResolveOperation(ResolveOperationRequest) returns (VersionedWriteResponse);
}

message KeywordRequest {
  string keyword = 1;
}

message InputRequest {
  string input = 1;
}

message EmptyRequest {}

message CountResponse {
  int64 count = 1;
}

message MatchesResponse {
  repeated string matches = 1;
}

// Positions holds the start offsets of one matched keyword. Needed because
// proto3 maps cannot have a repeated value directly.
message Positions {
  repeated int64 positions = 1;
}

message MatchIndexesResponse {
  map<string, Positions> matches = 1;
}

message InfoResponse {
  int64 keywords = 1;
  int64 nodes = 2;
}

message StatusResponse {
  string status = 1;
}

message VersionedStatusResponse {
  string status = 1;
  string active_version = 2;
  string serving_version = 3;
  bool building = 4;
  string last_refresh_success = 5;
  string last_refresh_failure = 6;
  uint64 refresh_failures = 7;
  int64 active_leases = 8;
}

message VersionedInputRequest { string input = 1; }

message VersionedScanRequest {
  string input = 1;
  int64 max_input_bytes = 2;
  int64 max_matches = 3;
  int64 max_candidates = 4;
  int32 kind = 5;
  bool whole_word = 6;
}

message VersionedRewriteRequest {
  string input = 1;
  string replacement = 2;
  string mask = 3;
  int64 max_input_bytes = 4;
  int64 max_matches = 5;
  int64 max_candidates = 6;
  int64 max_output_bytes = 7;
  bool whole_word = 8;
}

message SourceMatch {
  string keyword = 1;
  string text = 2;
  int64 start = 3;
  int64 end = 4;
  int64 byte_start = 5;
  int64 byte_end = 6;
}

message VersionedScanResponse {
  repeated SourceMatch matches = 1;
  bool truncated = 2;
}

message VersionedRewriteResponse {
  string text = 1;
  repeated SourceMatch matches = 2;
}

message VersionedWriteRequest {
  string expected_version = 1;
  string keyword = 2;
  repeated string keywords = 3;
}

message VersionedWriteResponse {
  string previous_version = 1;
  string version = 2;
  string operation_id = 3;
  int64 added = 4;
  int64 removed = 5;
  string outcome = 6;
}

message VersionedWaitRequest { string version = 1; }
message ResolveOperationRequest { string operation_id = 1; }
