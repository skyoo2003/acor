version: 2

project_name: acor

env:
- GO111MODULE=on
- CGO_ENABLED=0

before:
  hooks:
  - go mod download

builds:
- id: acor
  binary: acor
  main: cmd/acor/main.go
  # Stamps `acor version`. Without this a release binary reports its "dev"
  # default, so a bug report would not say which release it came from.
  # .Version, not .Tag: it is the unprefixed number the brew formula, the OCI
  # image.version label, and the archive names all carry, so `acor version` agrees
  # with whatever the user downloaded.
  ldflags:
  - -s -w -X main.version={{ .Version }}
  goos:
  - darwin
  - linux
  - windows
  goarch:
  - 386
  - amd64
  - arm
  - arm64
  goarm:
  - 6
  - 7
  ignore:
  - goos: darwin
    goarch: 386
  - goos: linux
    goarch: arm
    goarm: 6

archives:
- id: acor
  formats: [ tar.gz ]
  format_overrides:
  - goos: windows
    formats: [ zip ]
  files:
    - LICENSE
    - README.md
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md

changelog:
  disable: false

checksum:
  algorithm: sha256
  name_template: 'CHECKSUMS'

# Publishes Formula/acor.rb to skyoo2003/homebrew-tap. The token comes from a
# GitHub App installed only on that repository: the job's own GITHUB_TOKEN
# cannot write to another repo.
brews:
- ids:
  - acor
  repository:
    owner: skyoo2003
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  homepage: "https://github.com/skyoo2003/acor"
  description: "Aho-Corasick multi-pattern string matching on Redis or Valkey"
  license: "Apache-2.0"
  install: |
    bin.install "acor"
  # Every real command needs a Redis/Valkey server, so the only things assertable
  # here are the stamped version and the usage text on exit code 2.
  test: |
    assert_match version.to_s, shell_output("#{bin}/acor version")
    assert_match "Usage:", shell_output("#{bin}/acor 2>&1", 2)

dockers_v2:
- images:
  - ghcr.io/skyoo2003/acor
  dockerfile: Dockerfile.goreleaser
  ids:
  - acor
  sbom: false
  flags:
  - "--provenance=false"
  tags:
  - "{{ .Tag }}-alpine"
  - "v{{ .Major }}.{{ .Minor }}-alpine"
  - "v{{ .Major }}-alpine"
  - "latest-alpine"
  labels:
    org.opencontainers.image.created: "{{ .Date }}"
    org.opencontainers.image.source: "https://github.com/skyoo2003/acor"
    org.opencontainers.image.title: "{{ .ProjectName }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.version: "{{ .Version }}"

release:
  github:
    owner: skyoo2003
    name: acor
  name_template: "v{{ .Version }}"
  disable: false
  mode: replace
