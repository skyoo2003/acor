repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - "--maxkb=10000"
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-yaml
        args:
          - "--allow-multiple-documents"
      - id: detect-private-key
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Go checks run through the Makefile so the hooks, `make all`, and CI stay on
  # one definition — notably the pinned golangci-lint version and the server/
  # submodule, which the previous upstream hooks silently skipped.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        entry: make test
        language: system
        types: [go]
        pass_filenames: false
      - id: go-build
        name: go build
        entry: make build
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: make tidy-check
        language: system
        files: '(\.go|go\.mod|go\.sum)$'
        pass_filenames: false
      - id: add-spdx-header
        name: Add SPDX license header
        entry: python3 scripts/add-spdx-header.py
        language: system
        files: \.go$
        pass_filenames: true
